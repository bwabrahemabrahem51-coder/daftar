name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/" www/sw.js
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            sed -i "s|https://YOUR-PROJECT.supabase.co|${SUPABASE_URL}|" www/index.html
            sed -i "s|YOUR-ANON-KEY|${SUPABASE_KEY}|" www/index.html
          else
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set - app will show 'not linked'"
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create Android project
        run: |
          npx cap init "دفتر الديون" com.daftar.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Enable immersive fullscreen mode
        run: |
          cat > android/app/src/main/java/com/daftar/app/MainActivity.java <<'JAVA'
          package com.daftar.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  hideSystemUI();
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          final WebView wv = getBridge().getWebView();
                          wv.evaluateJavascript(
                              "(function(){try{return window.__daftarBack?window.__daftarBack():false}catch(e){return false}})()",
                              value -> {
                                  if (!"true".equals(value)) { moveTaskToBack(true); }
                              });
                      }
                  });
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) { hideSystemUI(); }
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN);
              }
          }
          JAVA

      - name: Generate app icon from project assets
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png
          cp icon-maskable-512.png assets/icon-foreground.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties
          python3 -c "p='android/app/build.gradle';c=open(p).read();signing='\n    signingConfigs {\n        release {\n            storeFile file(RELEASE_STORE_FILE)\n            storePassword RELEASE_STORE_PASSWORD\n            keyAlias RELEASE_KEY_ALIAS\n            keyPassword RELEASE_KEY_PASSWORD\n        }\n    }\n';c=c.replace('android {','android {'+signing,1);bt=c.index('buildTypes');rel=c.index('release {',bt);ins=rel+len('release {');c=c[:ins]+'\n            signingConfig signingConfigs.release'+c[ins:];open(p,'w').write(c)"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: daftar-apk
          path: android/app/build/outputs/apk/release/app-release.apk
