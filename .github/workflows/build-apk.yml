name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/" www/sw.js
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            sed -i "s|https://YOUR-PROJECT.supabase.co|${SUPABASE_URL}|" www/index.html
            sed -i "s|YOUR-ANON-KEY|${SUPABASE_KEY}|" www/index.html
          else
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set - app will show 'not linked'"
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create Android project
        run: |
          npx cap init "دفتر الديون" com.daftar.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: daftar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
